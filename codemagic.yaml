workflows:
  ios-build:
    name: iOS App Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          if [ -f "NutriPulse/package.json" ]; then
            cd NutriPulse
          fi
          npm install
      - name: Build web application
        script: |
          if [ -f "NutriPulse/package.json" ]; then
            cd NutriPulse
          fi
          npm run build
      - name: Setup Capacitor iOS
        script: |
          if [ -f "NutriPulse/package.json" ]; then
            cd NutriPulse
          fi
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS App (Unsigned IPA)
        script: |
          if [ -f "NutriPulse/package.json" ]; then
            cd NutriPulse
          fi
          if [ -d "ios/App" ]; then
            cd ios/App
          fi
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
          
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found compiled app bundle at: $APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r NutriPulse.ipa Payload
    artifacts:
      - "**/ios/App/NutriPulse.ipa"
      - "**/ios/App/build/**/*.app"
      - "**/dist/**"
