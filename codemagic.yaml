workflows:
  ios-build:
    name: iOS App Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web application
        script: |
          npm run build
      - name: Setup Capacitor iOS
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS App (Unsigned)
        script: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r NutriPulse.ipa Payload
    artifacts:
      - ios/App/NutriPulse.ipa
      - ios/App/build/Release-iphoneos/*.app
      - dist/**
