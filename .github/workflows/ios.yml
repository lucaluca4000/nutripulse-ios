name: Build NutriPulse iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build NutriPulse iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect Project Directory
        run: |
          PROJ_DIR="."
          if [ -f "package.json" ]; then
            PROJ_DIR="."
          elif [ -f "NutriPulse/package.json" ]; then
            PROJ_DIR="NutriPulse"
          else
            FOUND=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJ_DIR=$(dirname "$FOUND")
            fi
          fi
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "Project directory detected: $PROJ_DIR"

      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm install --legacy-peer-deps

      - name: Build Web App
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install Pods
        run: |
          cd ${{ env.PROJECT_DIR }}/ios/App
          pod install

      - name: Build iOS App (Xcode)
        run: |
          cd ${{ env.PROJECT_DIR }}/ios/App
          echo "=== Building iOS Release Package ==="
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build || \
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

      - name: Package IPA / APP
        run: |
          cd ${{ env.PROJECT_DIR }}/ios/App
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r ../../../NutriPulse.ipa Payload
            zip -r ../../../NutriPulse-AppBundle.zip "$APP_PATH"
          else
            echo "Error: No .app found in build directory"
            exit 1
          fi

      - name: Upload NutriPulse IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriPulse-iOS-IPA
          path: |
            NutriPulse.ipa
            NutriPulse-AppBundle.zip
